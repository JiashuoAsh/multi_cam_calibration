[pytest]
# pytest configuration for multi-camera calibration project

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options (install pytest-cov to enable)
addopts = 
    --verbose
    --strict-markers
    --tb=short
    # --cov=.
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-branch

# Markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for complete workflows
    slow: Tests that take more than 1 second
    requires_data: Tests that require test data files

# Ignore certain directories
norecursedirs = .git .tox dist build *.egg results images

# Timeout (optional)
timeout = 300

# Minimum coverage (optional)
# This will be enforced when sufficient tests are added
# --cov-fail-under=80
